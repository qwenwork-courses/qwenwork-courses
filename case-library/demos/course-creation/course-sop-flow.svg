  <text x="76" y="367" font-size="15" fill="#CFE8DA">5–6 千字 ≈ 一讲 15–18 分钟</text>

  <line x1="354" y1="293" x2="386" y2="293" stroke="#A8DEC1" stroke-width="4" marker-end="url(#ah)"/>

  <!-- Card 2: 卡点 A -->
  <rect x="395" y="205" width="290" height="176" rx="14" fill="#FFF4E8" stroke="#F28C3B" stroke-width="2" stroke-dasharray="6 4"/>
