  <rect x="1230" y="96" width="32" height="22" rx="4" fill="#FFF4E8" stroke="#F28C3B" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1272" y="114" font-size="16" fill="#142B3A">人工卡点（本人决策）</text>

  <!-- ===================== Row 1 ===================== -->

