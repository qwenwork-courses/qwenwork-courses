<script>
/* ============================================================================
 *  案例库入口
 *  ---------------------------------------------------------------------------
 *  官网 index.html 的 tab 加载器会把这里的 <script> 取出重建后再执行。实测在它
 *  之下：内联脚本会先于所有外部脚本运行，且多个外部 <script src> 之间的执行顺序
 *  不保证（会乱序）。所以本文件只放一个内联 bootstrap，用 await import() 显式控
 *  制模块加载顺序，不要改成 <script src>。
 *
 *  加新案例：在 case-library/assets/cases/ 下加一个文件，再把 id 追加到下面
 *  CASE_FILES 里（数组顺序 = 页面上同部门内的展示顺序）。
 * ========================================================================== */
(function () {
  var BASE = 'case-library/assets/';
  var CASE_FILES = [
    'contract-review',
    'bid-compliance',
    'hr-performance',
    'hr-campus-board',
    'amazon-ads',
    'social-content',
    'admin-reception',
    'personal-workspace',
    'course-creation',
    'course-poster',
    'finance-analysis',
    'expense-audit',
    'sales-visit-notes',
    'sales-proposal',
    'ops-quality',
    'drawing-quote'
  ];
  /* 拼成绝对地址：官网部署在子路径下时，相对说明符也能稳定解析 */
  var url = function (p) { return new URL(BASE + p, document.baseURI).href; };

  Promise.all([
    import(url('app.js')),
    Promise.all(CASE_FILES.map(function (n) { return import(url('cases/' + n + '.js')); }))
  ]).then(function (res) {
    res[0].boot(res[1].map(function (m) { return m.default; }));
  }).catch(function (err) {
    console.error('[案例库] 模块加载失败：', err);
    var box = document.getElementById('app');
    if (box) box.innerHTML = '<div class="loading-spinner">案例库加载失败，请刷新页面重试。</div>';
  });
})();
</script>
