/* 视频演示区块：严格按视频原比例、不超采样，避免两侧或上下黑边。
   max-width 由 JS（fitVideoBox）按视口高度写 inline，保证一屏内能看完整 */
#cases-app .video-block {
  width: 100%;
  max-width: 1216px;      /* 当前案例视频原尺寸宽 1216px；屏宽 > 1216 时保持原尺不拉伸发糊 */
  margin: 0 auto 8px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-md);
}
#cases-app .video-block video {
  display: block;
  width: 100%;
  height: auto;           /* 高度按原比例自动，不封顶 */
  /* aspect-ratio 由渲染时读取 video.width/height 写入 inline style；
     目的：避免 poster 图不同尺寸时预加载阶段把元素撑成错的高度。
     object-fit: cover 确保 poster 铺满（当前 poster 2532×1356 与视频 1216×720 比例不同），
     视频自身因与元素同宽高比，普通视图下不会被裁切 */
  object-fit: cover;
}
/* 全屏时元素变成屏幕比例（常见 1.5~1.78），与视频 1.689 不一致，
   再继续 cover 就会裁掉左右内容——所以全屏必须切成 contain，
   同时清掉我们自己加的尺寸限制，交给浏览器全屏层接管。
   两个前缀拆开写：部分引擎遇到不认识的伪类会丢掉整条规则。
   两种入口都盖：视频自身全屏（原生控件）与整个 figure 全屏 */
#cases-app .video-block video:fullscreen, #cases-app .video-block:fullscreen video {
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
  object-fit: contain;
  background: #000;
  aspect-ratio: auto !important;   /* 盖掉 inline 的 aspect-ratio，否则全屏下会被它锁死高度 */
}
#cases-app .video-block video:-webkit-full-screen, #cases-app .video-block:-webkit-full-screen video {
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
  object-fit: contain;
  background: #000;
  aspect-ratio: auto !important;
}
/* figure 自身全屏时去掉我们给的边框与 inline max-width，否则视频只占屏幕一小块 */
#cases-app .video-block:fullscreen, #cases-app .video-block:-webkit-full-screen {
  max-width: none !important;
  width: 100%;
  height: 100%;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  background: #000;
}

/* 演示物料链接 */
/* 相关材料：全部卡片排一行，分类用卡片内的小标签表达。
   minmax 下限取 240px：1200px 内容宽下三张卡能稳定同行，窄屏再自动掉行 */
#cases-app .links-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
#cases-app .link-card {
  /* 图标尺寸与列间距抽成变量：分类标签靠它们算缩进，改图标大小时不会错位 */
  --mat-ic: 38px;
  --mat-gap: 14px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  padding: 16px 20px 18px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  transition: all 0.18s ease;
}
/* 卡片内第二行：图标 + 标题/副文 + 箭头。
   用 flex-start 而不是 center：副文两行时 center 会把图标压到副文那一行去，
   顶对齐才能让图标与标题在同一行 */
#cases-app .link-card-main {
  display: flex;
  align-items: flex-start;
  gap: var(--mat-gap);
  width: 100%;
}
#cases-app .link-card:hover { border-color: var(--accent-line); box-shadow: var(--shadow-md); transform: translateY(-2px); }
#cases-app .link-card .ic {
  flex: none;
  width: var(--mat-ic);
  height: var(--mat-ic);
  border-radius: 10px;
  background: var(--accent-soft);
  color: var(--accent-dark);
  display: grid;
  place-items: center;
}
#cases-app .link-card .ic svg { width: 18px; height: 18px; }
/* 分类小标签：三类用不同底色区分。
   左侧缩进一个图标宽 + 列间距，让它正好落在标题文字上方而不是图标上方 */
#cases-app .link-group-tag {
  display: inline-block;
  margin-left: calc(var(--mat-ic) + var(--mat-gap));
  padding: 2px 7px;
  border-radius: 5px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  line-height: 1.5;
}
#cases-app .link-group-tag.g-skill { background: var(--accent-soft); color: var(--accent-deep); }
#cases-app .link-group-tag.g-sample { background: #fff4e6; color: #a35c00; }
#cases-app .link-group-tag.g-output { background: #eef3ff; color: #2f5fd0; }
#cases-app .link-card .tx { min-width: 0; }
#cases-app .link-card b { display: block; font-size: 14px; font-weight: 600; }
#cases-app .link-card small { display: block; margin-top: 3px; color: var(--subtle); font-size: 11.5px; }
#cases-app .link-card .arrow { margin-left: auto; color: var(--accent-3); align-self: center; }
#cases-app .link-card .arrow svg { width: 16px; height: 16px; }



/* 相关案例 */
#cases-app .related-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }

/* WIP 占位提示 */
#cases-app .wip-notice {
  display: flex;
  gap: 14px;
  padding: 20px 24px;
  border: 1px dashed var(--warn);
  border-radius: var(--r-md);
  background: var(--warn-soft);
  color: #92400e;
  font-size: 13.5px;
  line-height: 1.7;
}
#cases-app .wip-notice svg { flex: none; width: 18px; height: 18px; margin-top: 3px; }

/* ============================================================== 页脚 ==== */
#cases-app .site-footer {
  border-top: 1px solid var(--line);
  background: var(--bg-soft);
}
#cases-app .footer-inner {
  width: var(--page);
  margin: 0 auto;
  padding: 46px 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 40px;
}
#cases-app .footer-inner h3 { margin: 0 0 8px; font-size: 20px; letter-spacing: -0.03em; font-weight: 650; }
#cases-app .footer-inner p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
#cases-app .footer-meta {
  width: var(--page);
  margin: 0 auto;
  padding: 18px 0 30px;
  border-top: 1px solid var(--line);
  color: var(--subtle);
  font-size: 12px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

/* ============================================================ 预览弹窗 ==== */
#cases-app .modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(10, 26, 18, 0.42);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.24s ease;
}
#cases-app .modal-backdrop.show { opacity: 1; pointer-events: auto; }

#cases-app .modal-panel {
  position: relative;
  width: min(1200px, 100%);
  height: min(88vh, 900px);
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  transform: translateY(12px) scale(0.98);
  transition: transform 0.24s cubic-bezier(0.2, 0.72, 0.2, 1);
}
#cases-app .modal-backdrop.show .modal-panel { transform: none; }

#cases-app .modal-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px 14px 22px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-soft);
  flex: none;
}
#cases-app .modal-title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#cases-app .modal-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
  flex: none;
}
#cases-app .modal-actions .btn {
  padding: 8px 14px;
  font-size: 13px;
}
#cases-app .modal-actions #previewDownload {
  background: var(--accent);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 12px rgba(48, 191, 105, 0.24);
}
#cases-app .modal-actions #previewDownload:hover { background: var(--accent-dark); color: #fff; }

#cases-app .modal-frame {
  flex: 1;
  width: 100%;
  border: 0;
  background: #fff;
}
/* 文本预览（.md 等 content-type 不能直接内嵌渲染的文件）*/
#cases-app .modal-text {
  flex: 1;
  width: 100%;
  margin: 0;
  padding: 22px 26px;
  overflow: auto;
  background: var(--bg-soft);
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12.5px;
  line-height: 1.75;
  white-space: pre-wrap;
  word-break: break-word;
  -webkit-user-select: text;
  user-select: text;
}

@media (max-width: 720px) {
  #cases-app .modal-backdrop { padding: 12px; }
  #cases-app .modal-panel { height: 92vh; }
  #cases-app .modal-title { font-size: 13px; }
  #cases-app .modal-actions .btn { padding: 7px 10px; font-size: 12px; }
}

/* ==================================================== 页脚联系区 ==== */
#cases-app .footer-contact {
  display: flex;
  align-items: center;
  gap: 26px;
}

#cases-app .footer-qr {
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  flex: none;
}
#cases-app .footer-qr a {
  display: block;
  padding: 7px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  background: #fff;
  line-height: 0;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
}
#cases-app .footer-qr a:hover {
  border-color: var(--accent);
  box-shadow: 0 8px 22px rgba(48, 191, 105, 0.18);
  transform: translateY(-2px);
}
#cases-app .footer-qr img {
  display: block;
  width: 104px;
  height: 104px;
  border-radius: 4px;
}
#cases-app .footer-qr figcaption {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 0.01em;
  white-space: nowrap;
}

/* ===================================================== 分享案例弹窗 ==== */
#cases-app .share-modal .share-panel {
  position: relative;
  width: min(560px, 100%);
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  background: var(--surface);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  transform: translateY(12px) scale(0.97);
  transition: transform 0.26s cubic-bezier(0.2, 0.72, 0.2, 1);
}
#cases-app .share-modal.show .share-panel { transform: none; }

#cases-app .share-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px 18px 16px 26px;
  flex: none;
}
#cases-app .share-title {
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -0.02em;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* 弹窗关闭钮：之前没重置过，用的是浏览器默认 button 样式（灰底 + 边框）。
   现在做成无框图标钮，hover 才给一点淡底反馈 */
#cases-app .form-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--muted);
  cursor: pointer;
  transition: background 0.18s ease, color 0.18s ease;
  -webkit-appearance: none;
  appearance: none;
}
#cases-app .form-close:hover { background: var(--bg-soft); color: var(--text); }
#cases-app .form-close svg { display: block; }

#cases-app .share-head .form-close { position: static; margin-left: auto; flex: none; }

#cases-app .share-tabs {
  display: flex;
  gap: 4px;
  padding: 0 26px;
  border-bottom: 1px solid var(--line);
  flex: none;
}
#cases-app .share-tab {
  position: relative;
  padding: 11px 4px 13px;
  margin-right: 22px;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 14.5px;
  font-weight: 550;
  transition: color 0.18s ease;
}
#cases-app .share-tab::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  border-radius: 2px 2px 0 0;
  background: var(--accent);
  transform: scaleX(0);
  transition: transform 0.22s ease;
}
#cases-app .share-tab:hover { color: var(--text); }
#cases-app .share-tab.active { color: var(--accent-dark); font-weight: 650; }
#cases-app .share-tab.active::after { transform: scaleX(1); }

#cases-app .share-pane { display: none; padding: 22px 26px 26px; overflow-y: auto; }
#cases-app .share-pane.active { display: block; }

#cases-app .share-hint {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.6;
}

/* 链接分享 */
#cases-app .share-url { display: flex; gap: 10px; }
#cases-app .share-url input {
  flex: 1;
  min-width: 0;
  padding: 12px 14px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--text);
  font-family: 'SF Mono', ui-monospace, Menlo, monospace;
  font-size: 12.5px;
}
#cases-app .share-url input:focus { outline: 0; border-color: var(--accent); background: #fff; }
#cases-app .share-url .btn { flex: none; }

/* 海报 */
#cases-app .poster-stage {
  position: relative;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface-2);
  overflow: hidden;
  min-height: 200px;
}
#cases-app .poster-stage canvas {
  display: block;
  width: 100%;
  height: auto;
}
#cases-app .poster-loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--subtle);
  font-size: 13px;
  background: var(--surface-2);
  z-index: 1;
}

#cases-app .share-actions {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 18px;
  flex-wrap: wrap;
}
#cases-app .share-tip { color: var(--subtle); font-size: 12px; }

@media (max-width: 560px) {
  #cases-app .share-head { padding: 16px 12px 12px 18px; }
  #cases-app .share-tabs { padding: 0 18px; }
  #cases-app .share-pane { padding: 18px 18px 22px; }
  #cases-app .share-url { flex-direction: column; }
  #cases-app .share-url .btn { justify-content: center; }
}

/* ============================================================== Toast ==== */
#cases-app .toast {
  position: fixed;
  left: 50%;
  bottom: 40px;
  z-index: 200;
  padding: 12px 22px;
  border-radius: 999px;
  background: rgba(18, 28, 22, 0.92);
  backdrop-filter: blur(10px);
  color: #fff;
  font-size: 13.5px;
  font-weight: 500;
  box-shadow: 0 12px 34px rgba(10, 38, 21, 0.28);
  transform: translate(-50%, 14px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.24s ease, transform 0.24s cubic-bezier(0.2, 0.72, 0.2, 1);
}
#cases-app .toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ============================================================ 回到顶部 ==== */
#cases-app .to-top {
  position: fixed;
  right: 26px;
  bottom: 26px;
  z-index: 40;
  width: 42px;
  height: 42px;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(8px);
  color: var(--muted);
  display: grid;
  place-items: center;
  box-shadow: var(--shadow-md);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.24s ease, transform 0.24s ease;
}
#cases-app .to-top.show { opacity: 1; pointer-events: auto; }
#cases-app .to-top:hover { color: var(--accent-dark); border-color: var(--accent-line); transform: translateY(-2px); }
#cases-app .to-top svg { width: 18px; height: 18px; }

/* ============================================================ 视图切换 ==== */
#cases-app .view { animation: arrive 0.32s cubic-bezier(0.2, 0.72, 0.2, 1) both; }
@keyframes arrive {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

/* ============================================================== 响应式 ==== */
@media (max-width: 1200px) {
  #cases-app .case-grid, #cases-app .related-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 1080px) {
  #cases-app { --page: min(1340px, calc(100% - 32px)); }
  #cases-app .hero-inner { padding: 58px 0 46px; }
  #cases-app .detail-hero { grid-template-columns: minmax(0, 1fr); }
  #cases-app .detail-visual {
    border-left: 0;
    border-top: 1px solid var(--line);
    min-height: 0;
    aspect-ratio: 16 / 10;
  }
  #cases-app .detail-visual > video, #cases-app .detail-visual > img { height: 100%; }
  #cases-app .detail-copy { padding: 34px 28px 32px; }
  #cases-app .footer-inner { grid-template-columns: minmax(0, 1fr); }
  #cases-app .footer-contact { justify-content: flex-start; }
  #cases-app .detail-tabs { top: 62px; }
}

@media (max-width: 720px) {
  #cases-app .site-header .inner { height: 56px; gap: 14px; }
  #cases-app .main-nav { display: none; }
  #cases-app .case-grid, #cases-app .related-grid, #cases-app .overview-grid, #cases-app .compare-grid { grid-template-columns: minmax(0, 1fr); }

  /* Hero：标题与搜索框收紧 */
  #cases-app .hero-inner { padding: 44px 0 38px; }
  #cases-app .hero h1 { font-size: 30px; letter-spacing: -0.04em; }
  #cases-app .hero-stats-line { font-size: 12px; gap: 9px; }
  #cases-app .hero-stats-line .chev { display: none; }
  #cases-app .hero-sub { font-size: 14px; margin-top: 14px; }
  #cases-app .hero-search { margin-top: 26px; padding-left: 16px; border-radius: 12px; }
  #cases-app .hero-search input { padding: 13px 0; font-size: 15px; }
  #cases-app .hot-scenes { margin-top: 16px; gap: 7px; }
  #cases-app .hot-label { width: 100%; }
  #cases-app .hot-chip { padding: 6px 12px; font-size: 12.5px; min-height: 32px; }
  #cases-app .hero-slogan { margin-top: 34px; font-size: 12.5px; gap: 10px; }
  #cases-app .hero-slogan::before, #cases-app .hero-slogan::after { width: 26px; }
  #cases-app .dept-head { flex-wrap: wrap; }
  #cases-app .dept-head .desc { margin-left: 0; width: 100%; text-align: left; }
  #cases-app .dept-chip { min-height: 32px; }
  /* 页面内所有胶囊型按钮在触屏上统一押到 36px，弹窗关闭钮取 34px 方形热区 */
  #cases-app .btn { min-height: 36px; }
  #cases-app .form-close { min-width: 34px; min-height: 34px; }
  /* 二级分类在窄屏改为单行横向滑动，否则胶囊换行会把筛选区撑得很高 */
  #cases-app .toolbar { gap: 10px; }
  #cases-app .toolbar-head { gap: 8px; }
  #cases-app .view-tab { padding: 7px 12px; font-size: 12.5px; }
  /* 详情页：面包屑与路径标签的点击热区拉到 32px 以上 */
  #cases-app .breadcrumb { padding: 18px 0 14px; }
  #cases-app .breadcrumb a { padding: 6px 0; }
  #cases-app .detail-chips .chip-path { min-height: 32px; padding: 7px 12px; }
  #cases-app .dept-filter {
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  #cases-app .dept-filter::-webkit-scrollbar { display: none; }
  /* 胶囊不得被压缩，否则“数据聚合自动化”这种长标签会被挤成竖排 */
  #cases-app .dept-chip { flex-grow: 0; flex-shrink: 0; flex-basis: auto; white-space: nowrap; }
  #cases-app .detail-tabs { top: 56px; }

  /* 卡片：操作条收紧，但触屏上保证 40px 以上的点击热区 */
  #cases-app .card-media { height: 170px; }
  #cases-app .card-actions { gap: 12px; padding: 6px 14px; min-height: 52px; }
  #cases-app .card-actions .card-copy, #cases-app .card-actions .card-open { min-height: 40px; padding: 0 6px; }
  #cases-app .card-actions .card-copy { font-size: 12px; }
  /* 整卡热区底部让位给加高后的操作条，否则会盖住这两个按钮 */
  #cases-app .card-link { inset: 0 0 52px; }

  /* 详情页：亮点改为单列堆叠 */
  #cases-app .detail-copy { padding: 28px 20px 26px; }
  #cases-app .detail-copy h1 { font-size: 26px; }
  #cases-app .detail-audience { margin-bottom: 20px; }
  #cases-app .detail-actions .btn { padding: 10px 14px; font-size: 12.5px; }
  #cases-app .roi-summary {
    grid-template-columns: minmax(0, 1fr);
    margin-top: 28px;
    padding-top: 22px;
    gap: 18px;
  }
  #cases-app .roi-summary > div { padding-right: 0; }
  #cases-app .roi-summary > div + div {
    padding-left: 0;
    padding-top: 18px;
    border-left: 0;
    border-top: 1px solid var(--line);
  }
  #cases-app .roi-summary strong { font-size: 23px; }
  #cases-app .detail-visual { padding: 14px; }
  #cases-app .preview-badge { left: 24px; top: 26px; font-size: 11px; padding: 6px 11px; }
  #cases-app .preview-note { left: 24px; bottom: 26px; font-size: 11px; padding: 6px 11px; }
  #cases-app .tabs-inner a { padding: 13px 14px; font-size: 13px; }
  #cases-app .tabs-inner a::after { left: 14px; right: 14px; }
  #cases-app .section-lead { font-size: 14px; }
  /* 手机上 10.5px 太小，指标说明与区块标签统一抬到 11.5px */
  #cases-app .card-metrics small, #cases-app .roi-summary small, #cases-app .preview-note, #cases-app .preview-badge { font-size: 11.5px; }
  #cases-app .section-label { font-size: 12.5px; }
  #cases-app .prompt-cols { grid-template-columns: minmax(0, 1fr); }

  /* 页脚：按钮与二维码改为纵向堆叠 */
  #cases-app .footer-contact { flex-direction: column; align-items: flex-start; gap: 20px; }
  #cases-app .footer-qr { align-items: flex-start; }
}

@media print {
  #cases-app .site-header, #cases-app .toolbar, #cases-app .to-top, #cases-app .site-footer, #cases-app .detail-tabs, #cases-app .card-actions { display: none; }
  #cases-app .case-card { break-inside: avoid; box-shadow: none; }
}

/* ===== 嵌入模式（?embed=1，被官网 iframe 内嵌时） =====
   隐藏自带顶部导航栏（官网已有自己的导航），
   并把「预约演示」从导航栏移到 hero 标题区呈现 */
#cases-app .hero-cta { display: none; }
#cases-app.embed .site-header { display: none; }
#cases-app.embed .hero-cta {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 28px;
  padding: 12px 24px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  font-weight: 600;

/* =============================================================================
 *  \u6781\u7b80 QR \u7f16\u7801\u5668\uff08byte \u6a21\u5f0f\uff0c\u7248\u672c 1-40\uff0c\u56db\u7ea7\u5bb9\u9519\uff09
 *  ---------------------------------------------------------------------------
 *  \u4e13\u4e3a\u5206\u4eab\u6d77\u62a5\u751f\u6210\u6848\u4f8b\u94fe\u63a5\u4e8c\u7ef4\u7801\u3002\u65e0\u4f9d\u8d56\u3001\u4e0d\u8bf7\u6c42\u5916\u90e8\u670d\u52a1\uff08\u907f\u5f00\u7b2c\u4e09\u65b9
 *  \u4e8c\u7ef4\u7801 API \u5728\u56fd\u5185\u4e0d\u53ef\u7528 / \u6cc4\u9732\u94fe\u63a5\u7684\u95ee\u9898\uff09\u3002
 *
 *  \u7528\u6cd5\uff1a
 *    const m = QR.make('https://...');   // -> { size, get(x, y) }
 *    QR.draw(m, ctx, x, y, px, dark, light);
 *
 *  \u7b97\u6cd5\u6309 ISO/IEC 18004 \u5b9e\u73b0\uff08\u7ed3\u6784\u53c2\u8003 Nayuki \u7684\u516c\u5f00\u5b9e\u73b0\u601d\u8def\uff09\u3002
 *  \u8f93\u51fa\u5df2\u7528 macOS CoreImage \u5b9e\u9645\u626b\u7801\u89e3\u7801\u56de\u6d4b\u9a8c\u8bc1\u3002
 * ========================================================================== */
const QR = (function () {
  'use strict';

  /* \u6bcf\u5757\u7ea0\u9519\u7801\u5b57\u6570\uff1a[L, M, Q, H][version] */
  const ECC_PER_BLOCK = [
    [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
    [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30]
  ];

  /* \u7ea0\u9519\u5757\u6570\uff1a[L, M, Q, H][version] */
  const NUM_BLOCKS = [
    [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
    [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
    [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
    [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81]
  ];

  /* ---------- GF(256) \u8fd0\u7b97\uff0c\u672c\u539f\u591a\u9879\u5f0f 0x11D ---------- */
  function gfMul(x, y) {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = ((z << 1) ^ ((z >>> 7) * 0x11D)) & 0xFF;
      z ^= ((y >>> i) & 1) * x;
    }
    return z;
  }

  function rsDivisor(degree) {
    const result = new Uint8Array(degree);
    result[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < degree; j++) {
        result[j] = gfMul(result[j], root);
        if (j + 1 < degree) result[j] ^= result[j + 1];
      }
      root = gfMul(root, 0x02);
    }
    return result;

  function rsRemainder(data, divisor) {
    const result = new Uint8Array(divisor.length);
    for (const b of data) {
      const factor = b ^ result[0];
      result.copyWithin(0, 1);
      result[result.length - 1] = 0;
      for (let i = 0; i < divisor.length; i++) result[i] ^= gfMul(divisor[i], factor);
    }
    return result;
  }

  /* ---------- \u5bb9\u91cf\u8ba1\u7b97 ---------- */
  function numRawDataModules(ver) {
    let result = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      const numAlign = Math.floor(ver / 7) + 2;
      result -= (25 * numAlign - 10) * numAlign - 55;
      if (ver >= 7) result -= 36;
    }
    return result;
  }

  function numDataCodewords(ver, ecl) {
    return Math.floor(numRawDataModules(ver) / 8)
      - ECC_PER_BLOCK[ecl][ver] * NUM_BLOCKS[ecl][ver];
  }

  function alignPositions(ver) {
    if (ver === 1) return [];
    const num = Math.floor(ver / 7) + 2;
    const step = (ver === 32) ? 26
      : Math.ceil((ver * 4 + 4) / (num * 2 - 2)) * 2;
    const pos = [6];
    for (let p = ver * 4 + 10; pos.length < num; p -= step) pos.splice(1, 0, p);
    return pos;
  }

  /* ---------- \u4e3b\u6d41\u7a0b ---------- */
  function make(text, eclIndex) {
    const ecl = (eclIndex === undefined) ? 1 : eclIndex;   /* \u9ed8\u8ba4 M */
    const bytes = new TextEncoder().encode(text);

    /* \u9009\u6700\u5c0f\u53ef\u5bb9\u7248\u672c */
    let ver = 1;
    for (; ver <= 40; ver++) {
      const capBits = numDataCodewords(ver, ecl) * 8;
      const ccBits = (ver <= 9) ? 8 : 16;
      if (4 + ccBits + bytes.length * 8 <= capBits) break;
    }
    if (ver > 40) throw new Error('QR: \u5185\u5bb9\u8fc7\u957f');

    /* \u7ec4\u4f4d\u6d41\uff1a\u6a21\u5f0f\u6307\u793a\u7b26 + \u5b57\u7b26\u8ba1\u6570 + \u6570\u636e */
    const bits = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    push(0b0100, 4);
    push(bytes.length, ver <= 9 ? 8 : 16);
    for (const b of bytes) push(b, 8);

    /* \u7ed3\u675f\u7b26 + \u8865\u9f50\u5230\u5b57\u8282\u8fb9\u754c + \u586b\u5145\u5b57 */
    const dataCw = numDataCodewords(ver, ecl);
    const capBits = dataCw * 8;
    push(0, Math.min(4, capBits - bits.length));
    while (bits.length % 8 !== 0) bits.push(0);
    const dat = [];
    for (let i = 0; i < bits.length; i += 8) {
      let b = 0;
      for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
      dat.push(b);
    }
    for (let pad = 0xEC; dat.length < dataCw; pad ^= 0xEC ^ 0x11) dat.push(pad);

    /* \u5206\u5757\u7b97\u7ea0\u9519 + \u4ea4\u9519\u4ea4\u7ec7 */
    const numBlk = NUM_BLOCKS[ecl][ver];
    const eccLen = ECC_PER_BLOCK[ecl][ver];
    const rawCw = Math.floor(numRawDataModules(ver) / 8);
    const shortLen = Math.floor(rawCw / numBlk) - eccLen;
    const numShort = numBlk - rawCw % numBlk;
    const divisor = rsDivisor(eccLen);

    const blocks = [];
    for (let i = 0, k = 0; i < numBlk; i++) {
      const len = shortLen + (i < numShort ? 0 : 1);
      const d = dat.slice(k, k + len);
      k += len;
      blocks.push({ d, e: rsRemainder(d, divisor) });
    }
    const codewords = [];
    for (let i = 0; i < shortLen + 1; i++)
      for (let j = 0; j < numBlk; j++)
        if (i < blocks[j].d.length) codewords.push(blocks[j].d[i]);
    for (let i = 0; i < eccLen; i++)
      for (let j = 0; j < numBlk; j++) codewords.push(blocks[j].e[i]);

    /* ---------- \u753b\u77e9\u9635 ---------- */
    const size = ver * 4 + 17;
    const mod = [], fn = [];
    for (let i = 0; i < size; i++) {
      mod.push(new Array(size).fill(false));
      fn.push(new Array(size).fill(false));
    }
    const setFn = (x, y, v) => {
      if (x < 0 || y < 0 || x >= size || y >= size) return;
      mod[y][x] = v; fn[y][x] = true;
    };

    /* 定位图案（timing）——必须先画，随后的定位图形会覆盖它在角上的部分；
       反之则会把定位图形的边框抹掉，二维码扫不出来 */
    for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }

    /* 定位图形 + 分隔符 */
    const drawFinder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++)
        for (let dx = -4; dx <= 4; dx++) {
          const d = Math.max(Math.abs(dx), Math.abs(dy));
          setFn(cx + dx, cy + dy, d !== 2 && d !== 4);
        }
    };
    drawFinder(3, 3); drawFinder(size - 4, 3); drawFinder(3, size - 4);

    /* \u77eb\u6b63\u56fe\u5f62 */
    const ap = alignPositions(ver);
    for (let i = 0; i < ap.length; i++)
      for (let j = 0; j < ap.length; j++) {
        if ((i === 0 && j === 0) || (i === 0 && j === ap.length - 1) || (i === ap.length - 1 && j === 0)) continue;
        for (let dy = -2; dy <= 2; dy++)
          for (let dx = -2; dx <= 2; dx++)
            setFn(ap[j] + dx, ap[i] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }

    /* \u683c\u5f0f\u4fe1\u606f\u4f4d\u9884\u5360\uff08\u5185\u5bb9\u7a0d\u540e\u5199\uff09*/
    const reserveFormat = () => {
      for (let i = 0; i <= 5; i++) setFn(8, i, false);
      setFn(8, 7, false); setFn(8, 8, false); setFn(7, 8, false);
      for (let i = 9; i <= 14; i++) setFn(14 - i, 8, false);
      for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, false);
      for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, false);
      setFn(8, size - 8, true);   /* \u56fa\u5b9a\u6697\u6a21\u5757 */
    };
    reserveFormat();

    /* \u7248\u672c\u4fe1\u606f\uff08\u2265 v7\uff09*/
    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
      const bitsV = ver << 12 | rem;
      for (let i = 0; i < 18; i++) {
        const b = ((bitsV >>> i) & 1) === 1;
        const a = size - 11 + i % 3;
        const bb = Math.floor(i / 3);
        setFn(a, bb, b); setFn(bb, a, b);
      }
    }

    /* \u6570\u636e\u4f4d\u4e0a\u94fe\uff08\u53cc\u5217\u4e4b\u5b57\u5f62\uff09*/
    let bitIdx = 0;
    const totalBits = codewords.length * 8;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++)
        for (let j = 0; j < 2; j++) {
          const x = right - j;
          const upward = ((right + 1) & 2) === 0;
          const y = upward ? size - 1 - vert : vert;
          if (!fn[y][x] && bitIdx < totalBits) {
            mod[y][x] = ((codewords[bitIdx >>> 3] >>> (7 - (bitIdx & 7))) & 1) !== 0;
            bitIdx++;
          }
        }
    }

    /* \u63a9\u7801\uff1a8 \u79cd\u9010\u4e2a\u8bd5\uff0c\u53d6\u60e9\u7f5a\u5206\u6700\u4f4e */
    const maskFns = [
      (x, y) => (x + y) % 2,
      (x, y) => y % 2,
      (x, y) => x % 3,
      (x, y) => (x + y) % 3,
      (x, y) => (Math.floor(y / 2) + Math.floor(x / 3)) % 2,
      (x, y) => (x * y) % 2 + (x * y) % 3,
      (x, y) => ((x * y) % 2 + (x * y) % 3) % 2,
      (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2
    ];

    };

      const eclBits = [0b01, 0b00, 0b11, 0b10][ecl];   /* L,M,Q,H \u7684\u7f16\u53f7 */

      for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, bit(i));
    };

    const penalty = () => {
      let p = 0;
      /* \u89c4\u5219 1\uff1a\u540c\u8272\u8fde\u7eed */
      for (let y = 0; y < size; y++) {
        let run = 1;
        for (let x = 1; x < size; x++) {
          if (mod[y][x] === mod[y][x - 1]) { run++; if (run === 5) p += 3; else if (run > 5) p++; }
          else run = 1;
        }
      }
      for (let x = 0; x < size; x++) {
        let run = 1;
        for (let y = 1; y < size; y++) {
          if (mod[y][x] === mod[y - 1][x]) { run++; if (run === 5) p += 3; else if (run > 5) p++; }
          else run = 1;
        }
      }
      /* \u89c4\u5219 2\uff1a2x2 \u540c\u8272\u5757 */
      for (let y = 0; y < size - 1; y++)
        for (let x = 0; x < size - 1; x++) {
          const c = mod[y][x];
          if (c === mod[y][x + 1] && c === mod[y + 1][x] && c === mod[y + 1][x + 1]) p += 3;
        }
      /* \u89c4\u5219 3\uff1a\u7c7b\u5b9a\u4f4d\u56fe\u5f62 1:1:3:1:1 */
      const pat = [true, false, true, true, true, false, true];
      const hasPat = (get, i, n) => {
        if (i < 0 || i + 7 > n) return false;
        for (let k = 0; k < 7; k++) if (get(i + k) !== pat[k]) return false;
        const before = () => { for (let k = i - 4; k < i; k++) if (k >= 0 && get(k)) return false; return true; };
        const after = () => { for (let k = i + 7; k < i + 11; k++) if (k < n && get(k)) return false; return true; };
        return before() || after();
      };
      for (let y = 0; y < size; y++)
        for (let x = 0; x < size; x++) {
          if (hasPat(i => mod[y][i], x, size)) p += 40;
          if (hasPat(i => mod[i][x], y, size)) p += 40;
        }
      /* \u89c4\u5219 4\uff1a\u9ed1\u767d\u6bd4\u4f8b\u504f\u79bb */
      let dark = 0;
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (mod[y][x]) dark++;
      const total = size * size;
      p += Math.floor(Math.abs(dark * 20 - total * 10) / total) * 10;
      return p;

    for (let m = 0; m < 8; m++) {
      applyMask(m); drawFormat(m);
      const p = penalty();
      if (p < bestPenalty) { bestPenalty = p; bestMask = m; }
      applyMask(m);   /* \u5f02\u6216\u81ea\u9006\uff0c\u64a4\u56de */
    }
    applyMask(bestMask); drawFormat(bestMask);

/* =============================================================================
 *  \u5206\u4eab\u6d77\u62a5\u6e32\u67d3\uff08canvas\uff09
 *  ---------------------------------------------------------------------------
 *  \u81ea\u5305\u542b\uff1a\u4e0d\u4f9d\u8d56\u5916\u90e8\u5168\u5c40\u53d8\u91cf\uff0c\u6240\u9700\u5185\u5bb9\u5168\u90e8\u7531\u53c2\u6570\u4f20\u5165\u3002
 *  \u4e8c\u7ef4\u7801\u4f9d\u8d56 QR\uff08assets/qr.js\uff09\u3002
 *
 *  Poster.render(canvas, payload) -> Promise<void>
 *    payload = { title, slogan, deptName, client, metrics:[{value,label}],
 *                cover, url, logoSrc, brand, tagline }
 * ========================================================================== */
const Poster = (function () {
  'use strict';

  const W = 800;            /* 逻辑宽 */
  const H_MAX = 1500;       /* 离屏画布上限，最终高度按内容裁 */
  const SCALE = 2;          /* 二倍图，保证手机上清晰 */
  const PAD = 48;

  const GREEN = '#30bf69';
  const GREEN_DARK = '#22975a';
  const INK = '#141a16';
  const MUTED = '#4a5a50';
  const SUBTLE = '#7a8e82';
  const LINE = 'rgba(20,38,28,0.10)';

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* \u6309\u5bbd\u5ea6\u6298\u884c\uff08\u4e2d\u6587\u9010\u5b57\uff0c\u82f1\u6587\u6309\u8bcd\uff09*/
  function wrap(ctx, text, maxW, maxLines) {
    const lines = [];
    let cur = '';
    const tokens = String(text).match(/[a-zA-Z0-9@._%+-]+|[^\s]|\s/g) || [];
    for (const t of tokens) {
      if (t === '\n') { lines.push(cur); cur = ''; continue; }
      const test = cur + t;
      if (ctx.measureText(test).width > maxW && cur !== '') {
        lines.push(cur);
        cur = (t.trim() === '') ? '' : t;
        if (maxLines && lines.length >= maxLines) break;
      } else {
        cur = test;
      }
    }
    if (cur && (!maxLines || lines.length < maxLines)) lines.push(cur);
    if (maxLines && lines.length >= maxLines) {
      /* \u6ea2\u51fa\u65f6\u672b\u884c\u52a0\u7701\u7565\u53f7 */
      const total = (ctx.measureText(String(text)).width > maxW * maxLines);
      if (total) {
        let last = lines[maxLines - 1] || '';
        while (last && ctx.measureText(last + '\u2026').width > maxW) last = last.slice(0, -1);
        lines[maxLines - 1] = last + '\u2026';
      }
      lines.length = Math.min(lines.length, maxLines);
    }
    return lines;
  }

  function loadImg(src) {
    return new Promise(resolve => {
      if (!src) return resolve(null);
      const img = new Image();
      img.crossOrigin = 'anonymous';          /* CDN \u5df2\u5f00 ACAO:*\uff0c\u4e0d\u4f1a\u6c61\u67d3 canvas */
      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);      /* \u52a0\u4e0d\u51fa\u6765\u5c31\u7565\u8fc7\uff0c\u4e0d\u963b\u65ad\u6d77\u62a5 */
      img.src = src;
    });
  }

  async function render(canvas, p) {
    /* 先画到离屏画布（高度给宽），排完再按内容真实高度拷到目标画布，
       避免固定高度在标题/slogan 行数少时底部留一大片空白 */
    const off = document.createElement('canvas');
    off.width = W * SCALE;
    off.height = H_MAX * SCALE;
    const ctx = off.getContext('2d');
    ctx.scale(SCALE, SCALE);
    const FONT = '"PingFang SC","Microsoft YaHei",-apple-system,sans-serif';
 
    /* ---------- 底 ---------- */
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H_MAX);

    /* \u9876\u90e8\u6de1\u7eff\u5149 */
    const g = ctx.createLinearGradient(0, 0, W, 300);
    g.addColorStop(0, 'rgba(48,191,105,0.13)');
    g.addColorStop(1, 'rgba(76,226,133,0.05)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, 300);

    /* ---------- \u9876\u90e8\u54c1\u724c ---------- */
    let y = PAD;
    const [logo, cover] = await Promise.all([loadImg(p.logoSrc), loadImg(p.cover)]);
    if (logo) {
      const lh = 30, lw = logo.width / logo.height * lh;
      ctx.drawImage(logo, PAD, y, lw, lh);
      ctx.font = `500 15px ${FONT}`;
      ctx.fillStyle = SUBTLE;
      ctx.textBaseline = 'middle';
      ctx.fillText('\u6848\u4f8b\u5e93', PAD + lw + 14, y + lh / 2 + 1);
    } else {
      ctx.font = `700 22px ${FONT}`;
      ctx.fillStyle = INK;
      ctx.textBaseline = 'top';
      ctx.fillText(`${p.brand || '\u5343\u95ee\u529e\u516c'} \u00b7 \u6848\u4f8b\u5e93`, PAD, y + 4);
    }
    y += 30 + 34;

    /* ---------- \u90e8\u95e8 / \u5ba2\u6237\u6807\u7b7e ---------- */
    ctx.textBaseline = 'top';
    let cx = PAD;
    const chip = (text, bg, fg, bd) => {
      ctx.font = `600 15px ${FONT}`;
      const tw = ctx.measureText(text).width;
      const w = tw + 26, h = 32;
      ctx.fillStyle = bg;
      roundRect(ctx, cx, y, w, h, 8);
      ctx.fill();
      if (bd) { ctx.strokeStyle = bd; ctx.lineWidth = 1; ctx.stroke(); }
      ctx.fillStyle = fg;
      ctx.fillText(text, cx + 13, y + 8);
      cx += w + 10;
    };
    if (p.deptName) chip(p.deptName, GREEN, '#ffffff', null);
    if (p.client) chip(p.client, '#eefff5', GREEN_DARK, 'rgba(48,191,105,0.25)');
    y += 32 + 26;

    /* ---------- \u6807\u9898 ---------- */
    ctx.font = `700 40px ${FONT}`;
    ctx.fillStyle = INK;
    const titleLines = wrap(ctx, p.title || '', W - PAD * 2, 2);
    titleLines.forEach(l => { ctx.fillText(l, PAD, y); y += 52; });
    y += 8;

    /* ---------- slogan ---------- */
    if (p.slogan) {
      ctx.font = `400 19px ${FONT}`;
      ctx.fillStyle = MUTED;
      wrap(ctx, p.slogan, W - PAD * 2, 3).forEach(l => { ctx.fillText(l, PAD, y); y += 30; });
    }
    y += 26;

    /* ---------- \u5c01\u9762\u56fe ---------- */
    const cw = W - PAD * 2, ch = Math.round(cw * 9 / 16);
    ctx.save();
    roundRect(ctx, PAD, y, cw, ch, 16);
    ctx.clip();
    if (cover) {
      /* \u6309\u5bbd\u94fa\u6ee1\uff0c\u53d6\u9876\u90e8\uff08\u4e0e\u5361\u7247 object-position: top \u4e00\u81f4\uff09*/
      const s = cw / cover.width;
      ctx.drawImage(cover, PAD, y, cw, cover.height * s);
    } else {
      const cg = ctx.createLinearGradient(PAD, y, PAD + cw, y + ch);
      cg.addColorStop(0, '#1d3a2a');
      cg.addColorStop(1, '#121d18');
      ctx.fillStyle = cg;
      ctx.fillRect(PAD, y, cw, ch);
    }
    ctx.restore();
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1;
    roundRect(ctx, PAD, y, cw, ch, 16);
    ctx.stroke();
    y += ch + 34;

    /* ---------- \u4eae\u70b9\u6570\u5b57 ---------- */
    const ms = (p.metrics || []).slice(0, 3);
    if (ms.length) {
      ctx.strokeStyle = LINE;
      ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
      y += 24;
      const colW = (W - PAD * 2) / ms.length;
      ms.forEach((m, i) => {
        const x = PAD + colW * i;
        ctx.font = `700 30px ${FONT}`;
        ctx.fillStyle = GREEN_DARK;
        ctx.fillText(String(m.value), x, y);
        ctx.font = `400 14px ${FONT}`;
        ctx.fillStyle = SUBTLE;
        wrap(ctx, m.label, colW - 18, 2).forEach((l, k) => ctx.fillText(l, x, y + 40 + k * 20));
      });
      y += 40 + 44 + 24;
      ctx.strokeStyle = LINE;
      ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke();
      y += 30;
    }

    /* ---------- 二维码区（紧跟内容，不钉底）---------- */
    const qrBoxY = y + 6;
    const m = QR.make(p.url);
    const qpx = Math.floor(150 / (m.size + 2));   /* 含 1 模块内边距 */
    const qSide = m.size * qpx;
    const boxSide = qSide + qpx * 4;
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, PAD, qrBoxY, boxSide, boxSide, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(20,38,28,0.16)';
    ctx.stroke();
    QR.draw(m, ctx, PAD + qpx * 2, qrBoxY + qpx * 2, qpx, '#141a16', null);

    const tx = PAD + boxSide + 26;
    ctx.font = `600 20px ${FONT}`;
    ctx.fillStyle = INK;
    ctx.fillText('扫码查看完整案例', tx, qrBoxY + 18);
    ctx.font = `400 15px ${FONT}`;
    ctx.fillStyle = SUBTLE;
    wrap(ctx, p.tagline || '让 AI 落到真实场景，让实践沉淀为组织能力', W - tx - PAD, 2)
      .forEach((l, i) => ctx.fillText(l, tx, qrBoxY + 54 + i * 24));

    /* 底部署名 */
    ctx.font = `400 13px ${FONT}`;
    ctx.fillStyle = SUBTLE;
    ctx.fillText(`${p.brand || '千问办公'} · 全部门 AI 场景实践指引`, tx, qrBoxY + boxSide - 20);

    /* ---------- 按真实高度输出 ---------- */
    const finalH = Math.min(H_MAX, qrBoxY + boxSide + PAD);
    canvas.width = W * SCALE;
    canvas.height = finalH * SCALE;
    const out = canvas.getContext('2d');
    out.drawImage(off, 0, 0, W * SCALE, finalH * SCALE, 0, 0, W * SCALE, finalH * SCALE);
  }

  return { render, W, SCALE };
})();

/* ---------- 收藏 / 浏览量 / 分享 / 复制 ---------- */
/* 环境可能不支持 localStorage，统一走 try/catch + 内存回退 */
const FAV_KEY = 'qw_cases_fav';
let favMem = null;
function readFavs() {
  if (favMem) return favMem;
  try {
    favMem = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]'));
  } catch (e) { favMem = new Set(); }
  return favMem;
}
function isFav(id) { return readFavs().has(id); }
function toggleFav(id) {
  const s = readFavs();
  s.has(id) ? s.delete(id) : s.add(id);
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...s])); } catch (e) { /* 内存模式 */ }
  return s.has(id);
}

function toast(msg) {
  let el = $('#toast');
  if (!el) { el = h('div', 'toast'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1800);
}

/* 剪贴板写入：navigator.clipboard 在 http 非 localhost 下不可用，回退 execCommand */
function writeClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy') ? resolve() : reject(); } catch (e) { reject(e); }
    ta.remove();
  });
}
function copyText(text, btn, restoreHTML) {
  writeClipboard(text).then(() => {
    btn.classList.add('copied');
    const size = restoreHTML.includes('14') ? 14 : 15;
    btn.innerHTML = `${svgIcon('check', size)} 已复制`;
    toast('Prompt 已复制到剪贴板');
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = restoreHTML; }, 2000);
  }).catch(() => toast('复制失败，请手动选中文本'));
}

/* 案例链接：分享出去的链接必须是别人能打开的。
   - 已部署到真实域名（GitHub Pages / 内网域名）：以当前页面地址为准，只换 hash，
     这样换域名、放内网都不用改代码
   - 本地预览（localhost / 127.0.0.1 / 局网 IP / file://）：回落到 SITE.publicUrl，
     否则复制出来的是 127.0.0.1 这种只有自己能打开的地址
   search 参数丢掉保持链接干净。*/
function isLocalPreview() {
  const hn = location.hostname;
  return location.protocol === 'file:' || !hn
    || hn === 'localhost' || hn === '127.0.0.1' || hn === '[::1]'
    || /\.local$/.test(hn)
    || /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(hn);
}

function caseUrl(id) {
  /* publicUrl 缺失或写错时不能抛异常（一抛整个分享弹窗就挂了），回落到当前地址 */
  let base = location.href;
  if (isLocalPreview() && SITE.publicUrl) {
    try { base = new URL(SITE.publicUrl).href; } catch (e) { base = location.href; }
  }
  const u = new URL(base);
  u.search = '';
  u.hash = `#/case/${id}`;
  return u.href;
}

function shareCase(c) {
  openShareModal(c);
}

/* ---------- Routing ---------- */
function navigate(view, id) {
  if (view === 'detail' && id) {
    currentView = 'detail';
    currentCase = CASES.find(c => c.id === id) || null;
    void ({ view, id }, '', `#/case/${id}`);
  } else {
    currentView = 'gallery';
    currentCase = null;
    void ({ view: 'gallery' }, '', '#/');
  }
  render();
  window.scrollTo({ top: 0 });
}

if (0) __winAdd('popstate', (e) => {
  const s = e.state || {};
  if (s.view === 'detail' && s.id) {
    currentView = 'detail';
    currentCase = CASES.find(c => c.id === s.id) || null;
  } else {
    currentView = 'gallery';
    currentCase = null;
  }
  render();
});

/* 手改 hash / 外部跳转（如客户点开分享链接而页面已开着）时同步视图。
   pushState 不触发 hashchange，所以与 navigate() 不会重复渲染。*/
if (0) __winAdd('hashchange', () => {
  const m = location.hash.match(/^#\/case\/(.+)$/);
  const nextCase = m ? (CASES.find(c => c.id === m[1]) || null) : null;
  const nextView = nextCase ? 'detail' : 'gallery';
  if (nextView === currentView && nextCase === currentCase) return;
  currentView = nextView;
  currentCase = nextCase;
  render();
  window.scrollTo({ top: 0 });
});

/* ---------- Init ---------- */
function initFromHash() { currentView = 'gallery'; currentCase = null; }

function syncHotChips() {

/* 横向滑动行的可用性补齐（筛选胶囊行、详情页 Tab 条共用）：
   1. 边缘渐隐提示——隐了滚动条之后必须告诉用户“还有内容可滑”
   2. 指针拖拽——手机上原生滑动很自然，但桌面缩窗口时鼠标拖不动（原生只认横向滚轮）
   3. 拖动超过阈值后吞掉这次 click，否则松手会误触胶囊 */
function enableXScroll(el) {
  if (!el) return;
  el.classList.add('x-scroll');
  const sync = () => {
    const max = el.scrollWidth - el.clientWidth;
    el.classList.toggle('can-scroll-left', max > 2 && el.scrollLeft > 2);
    el.classList.toggle('can-scroll-right', max > 2 && el.scrollLeft < max - 2);
  };
  el._xSync = sync;
  if (el.dataset.xScroll) { sync(); return; }
  el.dataset.xScroll = '1';

  el.addEventListener('scroll', sync, { passive: true });
  __winAdd('resize', sync);
  if (window.ResizeObserver) new ResizeObserver(sync).observe(el);

  let down = false, startX = 0, startLeft = 0, moved = false;
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch' || e.button !== 0) return;   /* 触摸交给原生惯性滚动 */
    down = true; moved = false; startX = e.clientX; startLeft = el.scrollLeft;
  });
  el.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - startX;
    if (!moved && Math.abs(dx) > 4) { moved = true; el.classList.add('is-dragging'); }
    if (moved) { el.scrollLeft = startLeft - dx; e.preventDefault(); }
  });
  const end = () => {
    if (moved) el.addEventListener('click', ev => { ev.stopPropagation(); ev.preventDefault(); }, { capture: true, once: true });
    down = false; moved = false; el.classList.remove('is-dragging');
    sync();
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', () => { if (down) end(); });
  sync();
}

/* 视频框高度控在一屏内：按视口高算高度预算，再用视频原比例反推最大宽度。
   为何不用纯 CSS：块级元素上 aspect-ratio + max-height 不会反推宽度（宽度已由父容器确定），
   结果只是把框压短、视频反而出现左右黑边，所以这里算好写 inline max-width。 */
function fitVideoBox(el) {
  /* 渲染阶段 wrap 还没挂到文档上，所以要能直接传元素；resize 时才走 document 查询 */
  const fig = el || $('.video-block');
  if (!fig) return;
  const vw = +fig.dataset.vw, vh = +fig.dataset.vh;
  if (!vw || !vh) return;
  /* 260px 给顶部导航 + Tab 条 + 区块标题 + 下方演示步骤的一部分留白 */
  const budget = Math.max(280, Math.min(620, window.innerHeight - 260));
  fig.style.maxWidth = Math.min(vw, Math.round(budget * vw / vh)) + 'px';
}
__winAdd('resize', () => fitVideoBox());

/* 重绘胶囊后把选中项拉到可见区——不用 scrollIntoView，避免它顺手滚动页面。
   位置用 rect 差值算：offsetLeft 是相对定位祖先的，而胶囊行本身不是定位元素，算出来会偏。
   余量取 34px：比边缘渐隐的 30px 大一点，否则选中项会刚好藏在渐隐里看不清 */
function keepActiveVisible(box) {
  const active = box.querySelector('.dept-chip.active');
  if (!active) return;
  const pad = 34;
  const max = Math.max(0, box.scrollWidth - box.clientWidth);
  const bx = box.getBoundingClientRect();
  const ax = active.getBoundingClientRect();
  const l = ax.left - bx.left + box.scrollLeft;
  const r = l + ax.width;
  if (l - pad < box.scrollLeft) box.scrollLeft = Math.max(0, l - pad);
  else if (r + pad > box.scrollLeft + box.clientWidth) box.scrollLeft = Math.min(max, r + pad - box.clientWidth);
}

/* 上级 tab（按行业看 / 按实现路径看 / 我的收藏）+ 当前 tab 对应的二级分类。
   两套分类互斥：切 tab 时不会带着另一套的选中项，也不做叠加筛选。
   计数为 0 的类别置灰禁用而不隐藏，让完整分类表始终可见、切搜索词时也不跳行。 */
function renderFilters() { renderViewTabs(); renderSubFilter(); }

function renderViewTabs() {
  const box = $('#viewTabs');
  if (!box) return;
  const hits = CASES.filter(c => matchCase(c, searchQuery));
  const favCount = hits.filter(c => isFav(c.id)).length;
  box.innerHTML = '';

  const tabs = [
    { id: 'dept', label: '按行业看' },
    { id: 'path', label: '按实现路径看' },
    { id: 'fav', label: `${svgIcon('bookmark', 13)} 我的收藏 <span class="count">${favCount}</span>` }
  ];
  tabs.forEach(t => {
    const btn = h('button', `view-tab ${viewMode === t.id ? 'active' : ''}`, t.label);
    btn.onclick = () => {
      if (viewMode === t.id) return;
      viewMode = t.id;
      renderFilters();
      renderResults();
    };
    box.appendChild(btn);
  });
}

/* 二级分类：按行业看→DEPTS胶囊，按实现路径看→PATHS胶囊，收藏视图→不出二级 */
function renderSubFilter() {
  const box = $('#subFilter');
  if (!box) return;
  box.innerHTML = '';
  box.hidden = viewMode === 'fav';
  if (viewMode === 'fav') return;

  const byPath = viewMode === 'path';
  const groups = byPath ? PATHS : DEPTS;
  const keyOf = c => (byPath ? c.path : c.dept);
  const current = byPath ? currentPath : currentDept;
  const setCurrent = v => { if (byPath) currentPath = v; else currentDept = v; };
  const hits = CASES.filter(c => matchCase(c, searchQuery));

  const allBtn = h('button', `dept-chip ${current === null ? 'active' : ''}`, `全部 <span class="count">${hits.length}</span>`);
  allBtn.onclick = () => { setCurrent(null); renderFilters(); renderResults(); };
  box.appendChild(allBtn);

  groups.forEach(g => {
    const cnt = hits.filter(c => keyOf(c) === g.id).length;
    const btn = h('button', `dept-chip ${byPath ? 'path-chip' : ''} ${cnt ? '' : 'is-empty'} ${current === g.id ? 'active' : ''}`,
      `${g.name} <span class="count">${cnt}</span>`);
    btn.title = g.desc || '';
    if (!cnt) btn.disabled = true;
    btn.onclick = () => { setCurrent(current === g.id ? null : g.id); renderFilters(); renderResults(); };
    box.appendChild(btn);
  });

  enableXScroll(box);
  keepActiveVisible(box);
  if (box._xSync) box._xSync();   /* 上一步可能改了 scrollLeft，边缘渐隐得重算 */
}

/* 全文匹配：标题/slogan/概述/标签/痛点/方案/人群/部门名/客户均参与，多词需全部命中。
   注意：不能把 dept.desc 加进来——部门描述里的词会让同部门所有案例被误命中
   （如法务 desc 含“合同”，会导致搜“合同”时把招投标案例也带出来）*/
function matchCase(c, q) {
  if (!q) return true;
  const dept = DEPTS.find(d => d.id === c.dept) || {};
  const path = PATHS.find(p => p.id === c.path) || {};
  const hay = [
    c.title, c.slogan, c.summary, c.client, c.clientNote, c.before, c.after, c.prompt,
    dept.name, dept.en, path.name, path.en,
    ...(c.tags || []), ...(c.audience || []), ...(c.pains || []),
    ...(c.solutions || []), ...(c.demoLine || []),
    ...(c.metrics || []).map(m => `${m.value} ${m.label}`),
    ...(c.links || []).map(l => l.label)
  ].filter(Boolean).join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t));
}

function renderResults() {
  const box = $('#results');
  if (!box) return;
  box.innerHTML = '';

  const isFavView = viewMode === 'fav';
  const byPath = viewMode === 'path';
  const hits = CASES.filter(c =>
    matchCase(c, searchQuery)
    && (isFavView ? isFav(c.id) : true)
    && (byPath ? (currentPath ? c.path === currentPath : true)
      : (!isFavView && currentDept ? c.dept === currentDept : true))
  );
  const countEl = $('#resultsCount');
  if (countEl) {
    countEl.textContent = isFavView ? `已收藏 ${hits.length} 个案例`
      : searchQuery ? `匹配到 ${hits.length} 个案例`
        : `${hits.length} 个案例`;
  }

  if (!hits.length) {
    box.innerHTML = isFavView
      ? `<div class="empty-state">
           <strong>还没有收藏任何案例</strong>
           <span>点卡片右上角的书签图标，把常用案例收起来，下次直接从这里拿</span>
         </div>`
      : `<div class="empty-state">
           <strong>没找到匹配“${searchQuery}”的案例</strong>
           <span>试试换个关键词，或点上方“热门场景”快速定位</span>
         </div>`;
    return;
  }

  /* 收藏视图：收藏本身跨两套分类，不分组，直接一片网格 */
  if (isFavView) {
    const grid = h('div', 'case-grid');
    hits.forEach((c, ci) => {
      const dept = DEPTS.find(d => d.id === c.dept) || {};
      grid.appendChild(renderCard(c, dept, CARD_COLORS[ci % CARD_COLORS.length]));
    });
    box.appendChild(grid);
    return;
  }

  /* 按行业看→按 DEPTS 分组；按实现路径看→按 PATHS 分组（分组头用各自的名称/英文/说明）*/
  const groups = byPath ? PATHS : DEPTS;
  const current = byPath ? currentPath : currentDept;
  const keyOf = c => (byPath ? c.path : c.dept);
  const groupsToShow = current ? groups.filter(g => g.id === current) : groups;

  groupsToShow.forEach(g => {
    const cases = hits.filter(c => keyOf(c) === g.id);
    if (!cases.length) return;
    const sec = h('section', 'dept-section');
    sec.id = `${byPath ? 'path' : 'dept'}-${g.id}`;
    sec.innerHTML = `<div class="dept-head"><h2>${g.name}</h2><span class="en">${g.en}</span><span class="desc">${g.desc}</span></div>`;
    const grid = h('div', 'case-grid');
    cases.forEach((c, ci) => {
      const dept = DEPTS.find(d => d.id === c.dept) || {};
      grid.appendChild(renderCard(c, dept, CARD_COLORS[ci % CARD_COLORS.length]));
    });
    sec.appendChild(grid);
    box.appendChild(sec);
  });
}

function renderCard(c, dept, colors) {
  const card = h('article', `case-card ${c.status === 'wip' ? 'is-wip' : ''}`);
  const statusLabel = c.status === 'live' ? '可演示' : c.status === 'demo' ? '有素材' : '待补充';
  const path = PATHS.find(p => p.id === c.path) || {};
  card.style.setProperty('--c1', colors[0]);
  card.style.setProperty('--c2', colors[1]);
  const faved = isFav(c.id);
  card.innerHTML = `
    <div class="card-media${c.cover ? ' has-cover' : ''}">
      ${c.cover ? `<img class="cover-img" src="${c.cover}" alt="${c.title} 预览" loading="lazy">` : `<span class="watermark">${dept.en}</span>`}
      <span class="status-pill ${c.status}"><i></i>${statusLabel}</span>
      <button type="button" class="card-fav ${faved ? 'active' : ''}" aria-label="收藏案例" aria-pressed="${faved}">${svgIcon('bookmark', 18)}</button>
    </div>
    <div class="card-body">
      <div class="card-meta">
        <span class="card-dept">${dept.name}${c.client ? ` · ${c.client}` : ''}</span>
        ${path.name ? `<span class="card-path" title="实现路径：${path.desc || ''}">${path.name}</span>` : ''}
      </div>
      <h3>${c.title}</h3>
      <p class="card-slogan">${c.slogan}</p>
      <div class="card-badges">${c.tags.slice(0, 3).map(t => `<span>${t}</span>`).join('')}</div>
      <div class="card-metrics">
        ${c.metrics.slice(0, 3).map(m => `<div><strong>${m.value}</strong><small>${m.label}</small></div>`).join('')}
      </div>
    </div>
    <div class="card-actions">
      ${c.prompt ? `<button type="button" class="card-copy">${svgIcon('copy', 15)} 一键复制 Prompt</button>` : ''}
      <a class="card-open" href="#/case/${c.id}">查看案例 ${svgIcon('arrowR', 15)}</a>
    </div>
    <a class="card-link" href="#/case/${c.id}" aria-label="查看「${c.title}」详情"></a>
  `;

  card.querySelector('.card-link').addEventListener('click', e => { e.preventDefault(); navigate('detail', c.id); });
  card.querySelector('.card-open').addEventListener('click', e => { e.preventDefault(); navigate('detail', c.id); });

  card.querySelector('.card-fav').addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    const on = toggleFav(c.id);
    e.currentTarget.classList.toggle('active', on);
    e.currentTarget.setAttribute('aria-pressed', on);
    toast(on ? '已收藏案例' : '已取消收藏');
    /* 收藏数变了，刷新 tab 上的计数；若正在收藏视图，取消后该卡需移出 */
    if ($('#viewTabs')) renderFilters();
    if (viewMode === 'fav') renderResults();
  });

  const copyBtn = card.querySelector('.card-copy');
  if (copyBtn) copyBtn.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    copyText(c.prompt, copyBtn, `${svgIcon('copy', 15)} 一键复制 Prompt`);
  });

  return card;
}

      <div class="detail-actions">
        ${c.prompt ? `<button type="button" class="btn primary copy-prompt">${svgIcon('copy', 16)} 一键复制 Prompt</button>` : ''}
        <button type="button" class="btn share-case">${svgIcon('share', 16)} 分享案例</button>
        <button type="button" class="btn fav-case ${faved ? 'active' : ''}" aria-pressed="${faved}">${svgIcon('bookmark', 16)} <span class="fav-label">${faved ? '已收藏' : '收藏案例'}</span></button>
      </div>
      <div class="roi-summary">
        ${c.metrics.map((m, i) => `<div><span>亮点 0${i + 1}</span><strong>${m.value}</strong><small>${m.label}</small></div>`).join('')}
      </div>
    </div>
    <figure class="detail-visual">
      ${c.media ? (c.media.type === 'video'
        ? `<video src="${c.media.src}" autoplay loop muted playsinline preload="metadata" poster="${c.media.poster || ''}"></video>`
        : `<img src="${c.media.src}" alt="${c.title} 动态演示" loading="lazy">`)
        : (c.cover
          ? `<img src="${c.cover}" alt="${c.title} 效果预览" loading="lazy">`
          : `<div class="visual-placeholder">${svgIcon('play', 46)}<span>演示动图即将上线</span></div>`)}
      <figcaption class="preview-badge"><i></i>${c.media ? '动态实践预览' : '案例效果预览'}</figcaption>
      <span class="preview-note">${c.media && c.media.caption ? c.media.caption : '真实操作片段 · 自动循环播放'}</span>
    </figure>
  `;
  wrap.appendChild(hero);

  /* Hero 按钮交互 */
  const pathChip = hero.querySelector('.chip-path');
  if (pathChip) pathChip.addEventListener('click', () => {
    /* 点路径标签回列表页，直接切到「按实现路径看」并定位到该路径 */
    viewMode = 'path'; currentPath = c.path;
    navigate('gallery');
    setTimeout(() => { const el = $('.toolbar'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60);
  });
  const copyBtn = hero.querySelector('.copy-prompt');
  if (copyBtn) copyBtn.addEventListener('click', () => copyText(c.prompt, copyBtn, `${svgIcon('copy', 16)} 一键复制 Prompt`));
  hero.querySelector('.share-case').addEventListener('click', () => shareCase(c));
  const favBtn = hero.querySelector('.fav-case');
  favBtn.addEventListener('click', () => {
    const on = toggleFav(c.id);
    favBtn.classList.toggle('active', on);
    favBtn.setAttribute('aria-pressed', on);
    favBtn.querySelector('.fav-label').textContent = on ? '已收藏' : '收藏案例';
    toast(on ? '已收藏案例' : '已取消收藏');
  });

  /* Tab 导航（锚点跳转 + 滚动高亮） */
  const tabDefs = [
    { id: 'overview', label: '案例概览', has: c.pains.length > 0 },
    { id: 'compare',  label: '效果对比', has: !!(c.before && c.after) },
    /* 有视频就叫「视频演示」，没视频才叫「演示路径」 */
    { id: 'demo',     label: c.video ? '视频演示' : '演示路径', has: !!c.video || c.demoLine.length > 0 },
    { id: 'material', label: '相关材料', has: c.links.length > 0 },
    { id: 'prompt',   label: '复制 Prompt', has: !!c.prompt }
  ].filter(t => t.has);

  if (tabDefs.length > 1) {
    const tabs = h('nav', 'detail-tabs');
    tabs.innerHTML = `<div class="tabs-inner">${tabDefs.map((t, i) => `<a href="#sec-${t.id}" data-tab="${t.id}" class="${i === 0 ? 'active' : ''}">${t.label}</a>`).join('')}</div>`;
    tabs.querySelectorAll('[data-tab]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        const target = document.getElementById(`sec-${a.dataset.tab}`);
        if (target) window.scrollTo({ top: target.getBoundingClientRect().top + window.scrollY - 122, behavior: 'smooth' });
      });
    });
    wrap.appendChild(tabs);
    enableXScroll(tabs.querySelector('.tabs-inner'));   /* Tab 多于屏宽时同样给滑动提示与拖拽 */
  }

  /* Section 01: 案例概览（场景挑战 & 解决思路） */
  if (c.pains.length) {
    const sec = h('section', 'detail-section overview');
    sec.id = 'sec-overview';
    sec.innerHTML = `
      <span class="section-label">01 / 案例概览</span>
      <p class="section-lead">${c.summary}</p>
      <div class="overview-grid">
        <article class="pain-card">
          <div class="article-icon pain">${svgIcon('pain', 20)}</div>
          <span>典型挑战</span>
          <h3>这些问题你是不是也在面对</h3>
          <ul>${c.pains.map(p => `<li>${svgIcon('alertTri', 16)}${p}</li>`).join('')}</ul>
        </article>
        <article class="sol-card">
          <div class="article-icon solution">${svgIcon('check', 20)}</div>
          <span>解决思路</span>
          <h3>千问办公的做法</h3>
          <ul>${c.solutions.map(s => `<li>${svgIcon('check', 16)}${s}</li>`).join('')}</ul>
        </article>
      </div>
    `;
    wrap.appendChild(sec);
  }

  /* Section 02: 效果对比 */
  if (c.before && c.after) {
    const sec = h('section', 'detail-section');
    sec.id = 'sec-compare';
    sec.innerHTML = `
      <span class="section-label">02 / 效果对比</span>
      <div class="compare-grid">
        <figure class="before"><figcaption><span class="before-dot">以前</span></figcaption><p>${c.before}</p></figure>
        <figure class="after"><figcaption><span class="after-dot">现在</span></figcaption><p>${c.after}</p></figure>
      </div>
    `;
    wrap.appendChild(sec);
  }

  /* Section 03: 视频演示 / 演示路径 */
  if (c.video || c.demoLine.length) {
    const sec = h('section', 'detail-section');
    sec.id = 'sec-demo';
    const label = c.video ? '03 / 视频演示' : '03 / 演示路径';
    sec.innerHTML = `
      <span class="section-label">${label}</span>
      ${c.video ? `
        <figure class="video-block" data-vw="${c.video.width || ''}" data-vh="${c.video.height || ''}">
          <video src="${c.video.src}" poster="${c.video.poster || ''}"${c.video.width ? ` width="${c.video.width}" height="${c.video.height}" style="aspect-ratio:${c.video.width}/${c.video.height}"` : ''} controls controlsList="nodownload noplaybackrate" disablePictureInPicture playsinline preload="metadata"></video>
        </figure>` : '<h2>怎么用？</h2>'}
      ${c.demoLine.length ? `<ul class="demo-line${c.video ? ' after-video' : ''}">${c.demoLine.map(d => `<li>${d}</li>`).join('')}</ul>` : ''}
    `;
    wrap.appendChild(sec);
    if (c.video) fitVideoBox(sec.querySelector('.video-block'));   /* 视频框高度控在一屏内 */
  }

  /* Section 04: 相关材料——全部材料排成一行（窄屏自动换行）。
     不再按分组堆成多行，分类改用卡片上的小标签表达；
     顺序固定为 技能包 → 示例文档 → 产物，没标 group 的旧链接归为产物 */
  if (c.links.length) {
    const sec = h('section', 'detail-section');
    sec.id = 'sec-material';
    const kindIcon = { demo: 'live', doc: 'doc', text: 'doc', file: 'download', live: 'live' };
    const kindNote = { live: '在线体验', demo: '查看演示', doc: '查看文档', text: '点开预览 · 可下载', file: '下载资料' };
    const GROUP_NAME = { skill: '技能包', sample: '示例文档', output: '产物' };
    const ORDER = ['skill', 'sample', 'output'];
    const items = c.links
      .map((l, i) => ({ l, i, g: GROUP_NAME[l.group] ? l.group : 'output' }))
      .sort((a, b) => ORDER.indexOf(a.g) - ORDER.indexOf(b.g));

    sec.innerHTML = `
      <span class="section-label">04 / 相关材料</span>
      <div class="links-grid">
        ${items.map(({ l, i, g }) => `
          <a class="link-card" href="${l.href}" data-link-id="${i}">
            <span class="link-group-tag g-${g}">${GROUP_NAME[g]}</span>
            <span class="link-card-main">
              <span class="ic">${svgIcon(kindIcon[l.kind] || 'link', 18)}</span>
              <span class="tx">
                <b>${l.label}</b>
                <small>${l.note || kindNote[l.kind] || '查看文档'}</small>
              </span>
              <span class="arrow">${svgIcon(l.kind === 'file' ? 'download' : 'arrowR', 16)}</span>
            </span>
          </a>
        `).join('')}
      </div>
    `;
    wrap.appendChild(sec);
    sec.querySelectorAll('.link-card').forEach(a => {
      a.addEventListener('click', e => {
        const link = c.links[+a.dataset.linkId];
        if (openInModal(link)) e.preventDefault();
      });
    });
  }

  /* Section 05: 复制 Prompt（有 promptSections 就分栏展示，避免一大坨文字）*/
  if (c.prompt) {
    const sec = h('section', 'detail-section');
    sec.id = 'sec-prompt';
    const structured = Array.isArray(c.promptSections) && c.promptSections.length;
    sec.innerHTML = `
      <span class="section-label">05 / 复制 PROMPT</span>
      ${c.skill ? `<div class="prompt-skill-note">${svgIcon('scale', 16)}<span>本案例基于千问办公技能实现，需先安装对应技能（如 <b>${c.skill}</b>），再发送下面的 Prompt。实际技能名以你安装的为准。</span></div>` : ''}
      <div class="prompt-box">
        <div class="prompt-head"><span>直接告诉千问办公你的需求</span><button type="button" class="btn copy-prompt-2">${svgIcon('copy', 14)} 复制全文</button></div>
        ${structured ? `
          <div class="prompt-struct">
            ${c.promptLead ? `<p class="prompt-lead">${c.promptLead}</p>` : ''}
            <div class="prompt-cols">
              ${c.promptSections.map(s => `
                <section>
                  <h4>${s.title}</h4>
                  <ul>${s.items.map(i => `<li>${i}</li>`).join('')}</ul>
                </section>
              `).join('')}
            </div>
            ${c.promptTail ? `<p class="prompt-tail">${c.promptTail}</p>` : ''}
          </div>` : `<pre class="prompt-raw"></pre>`}
      </div>
    `;
    /* Prompt 正文用 textContent 灌进去：里面可能带 <a target="_blank"> 这类尖括号，
       走 innerHTML 会被当成标签吃掉，而复制出去的又必须是原文 */
    const pre = sec.querySelector('.prompt-raw');
    if (pre) pre.textContent = c.prompt;
    wrap.appendChild(sec);
    const btn2 = sec.querySelector('.copy-prompt-2');
    btn2.addEventListener('click', () => copyText(c.prompt, btn2, `${svgIcon('copy', 14)} 复制全文`));
  }

  /* WIP Notice */
  if (c.status === 'wip') {
    const sec = h('section', 'detail-section');
    sec.innerHTML = `<div class="wip-notice">${svgIcon('alertTri', 18)}<div><strong>该案例正在完善中</strong><br>内容框架已就绪，演示素材即将更新。如果您对这个场景感兴趣，欢迎联系我们提前了解。</div></div>`;
    wrap.appendChild(sec);
  }

  /* Related cases */
  const related = CASES.filter(r => r.dept === c.dept && r.id !== c.id).slice(0, 3);
  if (related.length) {
    const sec = h('section', 'detail-section');
    sec.innerHTML = `<span class="section-label">相关案例</span>`;
    const grid = h('div', 'related-grid');
    related.forEach((r, ri) => {
      const rd = DEPTS.find(d => d.id === r.dept) || {};
      grid.appendChild(renderCard(r, rd, CARD_COLORS[ri % CARD_COLORS.length]));
    });
    sec.appendChild(grid);
    wrap.appendChild(sec);
  }

  app.appendChild(wrap);
}

/* ---------- Nav ---------- */
function renderNav() {
  const nav = $('#mainNav');
  nav.innerHTML = '';
  DEPTS.forEach(d => {
    const cnt = CASES.filter(c => c.dept === d.id).length;
    if (!cnt) return;
    const a = h('a', '', d.name);
    a.href = `#dept-${d.id}`;
    a.addEventListener('click', e => { e.preventDefault(); viewMode = 'dept'; currentDept = d.id; navigate('gallery'); setTimeout(() => { const el = $(`#dept-${d.id}`); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 60); });
    nav.appendChild(a);
  });
}

/* ---------- Render ---------- */
function render() {
  if (currentView === 'detail') renderDetail();
  else renderGallery();
  setupScrollSpy();
}

/* Tab 滚动高亮：以当前视口上缘为基准选中最后一个已过的 section */
let spyHandler = null;
function setupScrollSpy() {
  if (spyHandler) { window.removeEventListener('scroll', spyHandler); spyHandler = null; }
  const tabs = $$('.detail-tabs [data-tab]');
  if (!tabs.length) return;
  const secs = tabs.map(t => document.getElementById(`sec-${t.dataset.tab}`)).filter(Boolean);
  spyHandler = () => {
    const line = window.scrollY + 160;
    let idx = 0;
    secs.forEach((s, i) => { if (s.offsetTop <= line) idx = i; });
    tabs.forEach((t, i) => t.classList.toggle('active', i === idx));
  };
  __winAdd('scroll', spyHandler, { passive: true });
  spyHandler();
}

/* ---------- Modal preview ---------- */
/*
 * kind 行为对照：
 *   demo / doc → 弹窗内预览（iframe）+ 下载按钮
 *   file       → 直接下载，不开预览（如 zip）
 *   live       → 新标签页打开（外部站点不允许 iframe 嵌入）
 */
function isPreviewable(link) {
  if (!link) return false;
  if (link.kind === 'demo' || link.kind === 'doc' || link.kind === 'text') return true;
  return false;
}
function renderLinkButton(link, extraClass = '') {
  const iconName = link.kind === 'demo' ? 'live' : link.kind === 'file' ? 'download' : link.kind === 'live' ? 'live' : 'doc';
  if (link.kind === 'live') {
    return `<a class="btn ${extraClass}" href="${link.href}" target="_blank" rel="noopener">${svgIcon(iconName, 16)} ${link.label}</a>`;
  }
  if (link.kind === 'file') {
    return `<a class="btn ${extraClass}" href="${link.href}" download>${svgIcon('download', 16)} ${link.label}</a>`;
  }
  return `<button type="button" class="btn ${extraClass}" data-preview-href="${link.href}" data-preview-label="${link.label}" data-preview-kind="${link.kind}">${svgIcon(iconName, 16)} ${link.label}</button>`;
}
function openInModal(link) {
  if (!isPreviewable(link)) {
    if (link.kind === 'file') {
      const a = document.createElement('a');
      a.href = link.href; a.download = link.downloadName || ''; document.body.appendChild(a); a.click(); a.remove();
      return true;
    }
    return false; /* live → 默认跳转 */
  }
  const backdrop = $('#previewModal');
  const frame = $('#previewFrame');
  const textBox = $('#previewText');
  const title = $('#previewTitle');
  const dl = $('#previewDownload');
  title.textContent = link.label;
  /* 下载按钮可以指向与预览不同的文件：
     技能包就是“预览 SKILL.md、下载整个 zip”这种组合 */
  dl.href = link.download || link.href;
  dl.setAttribute('download', link.downloadName || '');

  if (link.kind === 'text') {
    /* .md 的 content-type 是 text/markdown，丢给 iframe 会直接触发下载而不是展示，
       所以自己 fetch 文本放进 <pre>（textContent 赋值，不会执行任何内容）*/
    frame.hidden = true;
    frame.src = 'about:blank';
    textBox.hidden = false;
    textBox.textContent = '加载中…';
    fetch(link.href)
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(t => { textBox.textContent = t; textBox.scrollTop = 0; })
      .catch(err => { textBox.textContent = `文件读取失败（${err.message}）\n可直接点右上角“下载”拿完整包。`; });
  } else {
    textBox.hidden = true;
    textBox.textContent = '';
    frame.hidden = false;
    frame.src = link.href;   /* SVG / HTML 直接作为 iframe 就能展示 */
  }
  backdrop.classList.add('show');
  document.body.style.overflow = 'hidden';
  return true;
}
function closeModal() {
  const backdrop = $('#previewModal');
  const frame = $('#previewFrame');
  backdrop.classList.remove('show');
  frame.src = 'about:blank';
  document.body.style.overflow = '';
}
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-preview-href]');
  if (btn) {
    e.preventDefault();
    openInModal({ href: btn.dataset.previewHref, label: btn.dataset.previewLabel, kind: btn.dataset.previewKind });
  }
  if (e.target.matches('#previewModal') || e.target.closest('#previewClose')) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  closeModal();
  closeShareModal();
});

/* ---------- 分享案例弹窗（链接 / 海报）---------- */
let posterCase = null;
let posterDone = false;      /* 同一案例只渲染一次 */

function openShareModal(c) {
  posterCase = c;
  posterDone = false;
  const url = caseUrl(c.id);
  $('#shareUrl').value = url;                     /* 把链接明文展出来，所见即所复制 */
  $('#shareTitle').textContent = `分享「${c.title}」`;
  switchSharePane('link');
  $('#shareModal').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeShareModal() {
  $('#shareModal').classList.remove('show');
  document.body.style.overflow = '';
}

function switchSharePane(name) {
  $$('.share-tab').forEach(t => t.classList.toggle('active', t.dataset.pane === name));
  $$('.share-pane').forEach(p => p.classList.toggle('active', p.id === `pane-${name}`));
  if (name === 'poster') buildPoster();
}

function buildPoster() {
  if (!posterCase || posterDone) return;
  posterDone = true;
  const c = posterCase;
  const dept = DEPTS.find(d => d.id === c.dept) || {};
  const canvas = $('#posterCanvas');
  const loading = $('#posterLoading');
  loading.style.display = 'block';
  loading.textContent = '正在生成海报…';

  Poster.render(canvas, {
    title: c.title,
    slogan: c.slogan,
    deptName: dept.name,
    client: c.client,
    metrics: c.metrics,
    cover: c.cover,
    url: caseUrl(c.id),
    logoSrc: $('.brand-logo') ? $('.brand-logo').src : '',
    brand: SITE.brand,
    tagline: SITE.slogan
  }).then(() => {
    loading.style.display = 'none';
    /* toBlob 比 toDataURL 省内存，大图不卡 */
    canvas.toBlob(blob => {
      if (!blob) return;
      const a = $('#posterSave');
      if (a.dataset.url) URL.revokeObjectURL(a.dataset.url);
      const objUrl = URL.createObjectURL(blob);
      a.href = objUrl;
      a.dataset.url = objUrl;
      a.download = `千问办公案例_${c.title}.png`;
    }, 'image/png');
  }).catch(err => {
    posterDone = false;
    loading.textContent = '海报生成失败，请重试';
    console.error('poster:', err);
  });
}

$('#shareClose').addEventListener('click', closeShareModal);
$('#shareModal').addEventListener('click', e => { if (e.target.id === 'shareModal') closeShareModal(); });
$$('.share-tab').forEach(t => t.addEventListener('click', () => switchSharePane(t.dataset.pane)));
$('#shareCopy').addEventListener('click', () => {
  const btn = $('#shareCopy');
  const label = btn.innerHTML;
  const input = $('#shareUrl');
  input.select();
  writeClipboard(input.value).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = `${svgIcon('check', 16)} 已复制`;
    toast('案例链接已复制');
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = label; }, 2000);
  }).catch(() => toast('复制失败，请手动选中链接'));
});

/* ---------- 顶部「预约演示」与页脚联系区 ---------- */
/* 预约演示：平滑滚到页脚联系区。用 JS 滚而不靠 href 改 hash，
   因为本站是 hash 路由（#/case/xxx），改成 #contact 会误触 popstate 回到列表页 */
$('#ctaTop').addEventListener('click', e => {
  e.preventDefault();
  const el = $('#contact');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* embed 模式下 hero 里的「预约演示」：同样平滑滚到页脚联系区（事件委托，兼容 hero 重渲染）*/
document.addEventListener('click', e => {
  const c = e.target.closest && e.target.closest('#ctaHero');
  if (!c) return;
  e.preventDefault();
  const el = $('#contact');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* 页脚「联系我们」+ 二维码：均直指钉钉表单 */
(function initContact() {
  const cf = SITE.contactForm || {};
  if (cf.url) {
    $('#ctaFooter').href = cf.url;
    $('#qrLink').href = cf.url;
  }
  const qrWrap = $('#footerQr');
  if (cf.qr) {
    $('#qrImg').src = cf.qr;
    $('#qrCaption').textContent = cf.qrCaption || '扫码填写表单';
  } else if (qrWrap) {
    qrWrap.style.display = 'none';   /* 未配二维码时不留空框 */
  }
})();

/* ---------- Scroll ---------- */
const toTop = $('#toTop');
__winAdd('scroll', () => { toTop.classList.toggle('show', window.scrollY > 400); }, { passive: true });
toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

/* ---------- Boot ---------- */
initFromHash();
renderNav();
render();

})();
</script>
