<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>断点验证台</title>
<style>
  body { margin:0; background:#2b2f33; font-family:'PingFang SC',sans-serif; padding:16px; }
  .row { display:flex; gap:16px; align-items:flex-start; }
  .col { background:#fff; border-radius:6px; overflow:hidden; }
  .lab { color:#fff; font-size:12px; padding:4px 0; font-family:monospace; }
  iframe { border:0; display:block; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
// 用固定宽度 iframe 造出真实布局视口，绕开 headless 最小窗口宽度限制
var widths = (new URLSearchParams(location.search).get('w') || '375,500,760').split(',');
var page   = new URLSearchParams(location.search).get('p') || 'index.html#home';
var height = +(new URLSearchParams(location.search).get('h') || 1600);
var row = document.getElementById('row');
widths.forEach(function(w){
  var box = document.createElement('div');
  box.innerHTML = '<div class="lab">'+w+'px</div>';
  var f = document.createElement('iframe');
  f.width = w; f.height = height; f.src = '/' + page;
  var c = document.createElement('div'); c.className='col'; c.appendChild(f);
  box.appendChild(c); row.appendChild(box);
});
</script>
</body>
</html>
